<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous" />
</head>
<style>
    #first{
        height: 300px;
    }
    #second{
        height: 200px;
    }
    #third{
        height: 100px;
    }
    .hide{
        visibility: hidden;
    }
</style>
<body>
    <div class="container">
        <div id="grand-parent" class="bg-success w-75 mx-auto p-5">
            <div id="parent" class="bg-danger w-50 mx-auto p-5">
                <div id="child" class="bg-primary w-25 mx-auto p-5"></div>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-around">
        <div class="bg-dark h-50 p-2 ms-5 m-2 text-white rounded">Bubble</div>
        <div class="bg-dark h-50 p-2 ms-5 m-2 text-white rounded">Capture</div>
    </div>
    <div class="msg d-flex justify-content-around">
        <div id="bubble-msg" class="bg-primary p-3 rounded m-3">hi</div> <!-- Child to Parent-->
        <div id="capture-msg" class="bg-danger p-3 rounded m-3 ">hi</div> <!-- Parent TO CHild-->
    </div> 
    <script src="script.js"></script>
</body>
</html>
