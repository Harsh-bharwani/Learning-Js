<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .card-header{
            height: 40vh;
        }
    </style>
    <script>
        async function loadData(){
            const URL="https://fakestoreapi.com/products/category/jewelery";
            const container=document.getElementById("container");
            try
            {
                let response=await fetch(URL);
                let productDetails=await response.json();
                productDetails.forEach(details => {
                    let div=document.createElement("div");
                    div.innerHTML=` 
                    <div class="card border border-2">
                        <div class="card-header">
                                <img src="${details.image}" height="100" width="300" class="mx-auto">
                                <h3>${details.title}</h3>
                        </div>
                        <div class="card-body">
                            ${details.description}
                        </div>
                        <div class="card-footer d-flex justify-content-around">
                           <span> ${details.rating.rate}<span class="bi bi-star-fill text-warning"></span> </span><span>${details.rating.count}</span>
                        </div>
                    </div>`;
                    container.appendChild(div);
                });
            }
            catch(error){
                console.log(error);
            }
        }
    </script>
</head>
<body onload="loadData()">
    <div id="container" class="d-grid gap-2" style="grid-template-columns: auto auto auto;">
    </div>
</body>
</html>
